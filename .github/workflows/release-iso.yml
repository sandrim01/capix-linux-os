# Publica as ISOs (do build mais recente) como Release pública do GitHub.
#   - Releases podem ser baixadas sem login e com link direto (ao contrário dos artefatos).
#   - Cada ISO (~5 GB) é dividida em partes < 2 GB (limite por arquivo do GitHub).
#   - Edições: Desktop (AMD/Intel) e Segurança (OSINT + pentest).
# Dispara sozinho após cada build bem-sucedido, e também manualmente (workflow_dispatch).
name: release-iso
on:
  workflow_dispatch:
  workflow_run:
    workflows: ["build-capix"]
    types: [completed]

permissions:
  contents: write
  actions: read

jobs:
  release:
    runs-on: ubuntu-24.04
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Descobrir o build e baixar as ISOs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eux
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            RUN_ID=${{ github.event.workflow_run.id }}
          else
            RUN_ID=$(gh run list --workflow build.yml --status success --limit 1 \
                      --json databaseId -q '.[0].databaseId' -R "$GITHUB_REPOSITORY")
          fi
          echo "RUN_ID=$RUN_ID"
          gh run download "$RUN_ID" -n capix-iso     -D iso-desktop -R "$GITHUB_REPOSITORY"
          gh run download "$RUN_ID" -n capix-sec-iso -D iso-sec     -R "$GITHUB_REPOSITORY" || echo "sem ISO sec neste build"
          find iso-desktop iso-sec -type f -printf '%s\t%p\n' 2>/dev/null || true

      - name: Dividir, somar hash e publicar a Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          WORK=release_out; mkdir -p "$WORK"
          : > "$WORK/SHA256.txt"
          {
            echo "# Capix Linux OS — ISOs (mais recentes)"
            echo ""
            echo "Cada ISO vem dividida em partes \`.bin\` (limite de 2 GB por arquivo do GitHub)."
            echo "Baixe **todas** as partes da edição desejada, na mesma pasta, e junte."
          } > "$WORK/NOTES.md"

          ASSETS=""
          emit_edition() {
            DIR="$1"; PREFIX="$2"; TITLE="$3"
            ISO=$(find "$DIR" -name '*.iso' 2>/dev/null | head -1 || true)
            [ -z "${ISO:-}" ] && { echo "pulando $TITLE (sem ISO)"; return 0; }
            HASH=$(sha256sum "$ISO" | cut -d' ' -f1)
            SIZE=$(du -h "$ISO" | cut -f1)
            split -b 1900M -d --additional-suffix=.bin "$ISO" "$WORK/${PREFIX}.iso.part"
            printf '%s  %s.iso\n' "$HASH" "$PREFIX" >> "$WORK/SHA256.txt"
            for f in "$WORK/${PREFIX}.iso.part"*.bin; do ASSETS="$ASSETS $f"; done
            {
              echo ""
              echo "## ${TITLE} (${SIZE})"
              echo "- **Linux/macOS:** \`cat ${PREFIX}.iso.part*.bin > ${PREFIX}.iso\`"
              echo "- **Windows:** \`cmd /c copy /b ${PREFIX}.iso.part00.bin+${PREFIX}.iso.part01.bin+${PREFIX}.iso.part02.bin ${PREFIX}.iso\`"
              echo "- **SHA-256:** \`$HASH\`"
            } >> "$WORK/NOTES.md"
          }

          emit_edition iso-desktop capix-amd-intel "Capix Desktop — AMD/Intel"
          emit_edition iso-sec     capix-sec       "Capix Segurança — OSINT + Pentest"

          ls -lh "$WORK"
          gh release delete iso-latest -y --cleanup-tag -R "$GITHUB_REPOSITORY" 2>/dev/null || true
          gh release create iso-latest -R "$GITHUB_REPOSITORY" \
            --title "Capix ISOs (mais recentes)" \
            --notes-file "$WORK/NOTES.md" \
            $ASSETS "$WORK/SHA256.txt"
