<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Capix Faro — OSINT</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="author" content="UnbugSTI (UnbugSolutions-TI)">
<style>
  :root{--bg:#1b1b1d;--panel:#202023;--card:#2a2a2e;--card2:#333338;--line:#3e3e44;--txt:#f2f2f2;--mut:#a9a9b0;
        --acc:#F68B2C;--acc2:#ff9d45;--ok:#7CC74B;--warn:#ffb23d;--bad:#ff6b5b;
        --font:"Inter","Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;--mono:ui-monospace,"JetBrains Mono",Consolas,monospace}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:var(--bg);color:var(--txt);font:14px/1.5 var(--font)}
  button,input,textarea,select{font:inherit;color:inherit}
  .app{display:flex;height:100%}
  nav{width:250px;background:var(--panel);padding:16px 0;display:flex;flex-direction:column;flex:none}
  .brand{display:flex;align-items:center;gap:12px;padding:4px 20px 18px}
  .brand img{width:40px;height:40px}.brand b{font-size:18px;font-weight:600;display:block;line-height:1.1}.brand small{color:var(--mut);font-size:12px}
  .navi{display:flex;align-items:center;gap:14px;padding:0 20px;height:40px;cursor:pointer;border:0;border-left:4px solid transparent;background:none;width:100%;text-align:left}
  .navi:hover{background:rgba(255,255,255,.06)}.navi.on{border-left-color:var(--acc);background:rgba(246,139,44,.12)}
  .navi svg{width:18px;height:18px;flex:none}
  .navsep{margin:10px 20px 6px;font-size:11px;letter-spacing:1px;color:var(--mut)}
  .foot{margin-top:auto;padding:14px 20px 0;color:var(--mut);font-size:11px;opacity:.7}
  main{flex:1;overflow:auto;padding:26px 36px 60px}
  h1{font-size:26px;font-weight:300;margin-bottom:4px}
  h2{font-size:15px;font-weight:600;margin:22px 0 8px}
  .muted{color:var(--mut)}
  .search{display:flex;gap:8px;margin:16px 0 6px}
  .search input,textarea,.inp{flex:1;height:40px;background:#151517;border:1px solid var(--line);border-bottom:2px solid var(--acc);padding:0 12px;outline:none}
  textarea{height:200px;padding:10px 12px;font:12px/1.5 var(--mono);resize:vertical;width:100%}
  .btn{height:40px;padding:0 18px;border:1px solid transparent;background:var(--card2);cursor:pointer;white-space:nowrap}
  .btn.sm{height:30px;padding:0 12px;font-size:13px}
  .btn:hover{border-color:var(--mut)}.btn.pri{background:var(--acc);color:#1b120d;font-weight:600}.btn.pri:hover{background:var(--acc2);border-color:transparent}
  .btn:disabled{opacity:.5;cursor:default}
  .ex{font-size:12px;color:var(--mut)}.ex a{color:var(--acc2);cursor:pointer;text-decoration:none;margin-right:10px}
  .card{background:var(--card);padding:14px 16px;margin-bottom:8px}
  .card h3{font-size:13px;font-weight:600;margin-bottom:8px;display:flex;align-items:center;gap:8px}
  .card h3 svg{width:16px;height:16px;color:var(--acc)}
  .grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(360px,1fr));gap:8px}
  table.kv{width:100%;border-collapse:collapse;font-size:13px}
  table.kv td{padding:3px 0;vertical-align:top}table.kv td:first-child{color:var(--mut);width:150px;padding-right:12px}
  code,.mono{font-family:var(--mono);font-size:12px;word-break:break-all}
  .pill{display:inline-block;padding:1px 8px;border-radius:10px;font-size:12px;background:var(--card2);margin:1px 2px 1px 0}
  .pill.ok{background:rgba(124,199,75,.18);color:#b5e391}.pill.warn{background:rgba(255,178,61,.18);color:#ffd08a}.pill.bad{background:rgba(255,107,91,.18);color:#ffb0a6}
  .alert{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-bottom:1px solid var(--line)}
  .alert:last-child{border:0}
  .risk{display:flex;align-items:center;gap:16px;padding:14px 16px;margin-bottom:8px;background:var(--card)}
  .risk .num{font-size:34px;font-weight:300;width:84px}
  .risk.alto{background:linear-gradient(90deg,rgba(255,107,91,.22),var(--card) 60%)}
  .risk.medio{background:linear-gradient(90deg,rgba(255,178,61,.2),var(--card) 60%)}
  .risk.baixo{background:linear-gradient(90deg,rgba(124,199,75,.18),var(--card) 60%)}
  .list{max-height:260px;overflow:auto;columns:2;column-gap:20px;font:12px/1.7 var(--mono)}
  .chain{display:flex;flex-direction:column;gap:4px;font-size:13px}
  .chain div{display:flex;gap:10px;align-items:baseline}.chain .st{width:36px;color:var(--acc2);font-family:var(--mono)}
  .hops{position:relative;margin-left:8px;border-left:2px solid var(--line);padding-left:16px}
  .hop{position:relative;padding:4px 0 10px}.hop::before{content:"";position:absolute;left:-22px;top:9px;width:10px;height:10px;border-radius:50%;background:var(--acc)}
  .bar{display:flex;gap:8px;margin:14px 0 6px;flex-wrap:wrap;align-items:center}
  .spin{width:18px;height:18px;border:2px solid rgba(255,255,255,.2);border-top-color:var(--acc);border-radius:50%;animation:sp 1s linear infinite;display:inline-block;vertical-align:-4px;margin-right:8px}
  @keyframes sp{to{transform:rotate(360deg)}}
  .drop{display:block;border:2px dashed var(--line);padding:34px;text-align:center;cursor:pointer;margin-top:14px}
  .drop:hover,.drop.over{border-color:var(--acc);background:rgba(246,139,44,.06)}
  .case{display:flex;align-items:center;gap:12px;background:var(--card);padding:12px 16px;margin-bottom:6px;cursor:pointer}
  .case:hover{background:var(--card2)}.case b{flex:1;font-weight:500}
  .note{font-size:12px;color:var(--mut);background:var(--card);border-left:3px solid var(--acc);padding:10px 14px;margin-top:16px}
  .err{color:#ffb0a6}
  .demo{position:fixed;right:10px;bottom:8px;font-size:11px;color:var(--mut);opacity:.7}
  .hidden{display:none!important}
  select{height:30px;background:#151517;border:1px solid var(--line);padding:0 8px}
</style>
</head>
<body>
<div class="app">
  <nav>
    <div class="brand"><img class="logo-img" alt=""><div><b>Capix Faro</b><small>OSINT · infraestrutura e ameaças</small></div></div>
    <div id="nav"></div>
    <div class="foot">Capix Linux OS · by UnbugSTI</div>
  </nav>
  <main id="main"></main>
</div>
<div class="demo hidden" id="demo">modo de demonstração — resultados de exemplo</div>

<script>
const DRY = __FARO_DRY__;
/*__PREVIEW_MOCK__*/
const BASE = location.pathname.replace(/[^/]*$/, '');
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const asset = n => (window.FARO_ASSETS && FARO_ASSETS[n]) || ('assets/' + n);
const I = {
  globe:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/>',
  ip:'<rect x="3" y="4" width="18" height="7" rx="1"/><rect x="3" y="13" width="18" height="7" rx="1"/><path d="M7 7.5h.01M7 16.5h.01"/>',
  link:'<path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/>',
  file:'<path d="M6 2h9l5 5v15H6z"/><path d="M14 2v6h6"/>',
  hash:'<path d="M5 9h14M5 15h14M10 3 8 21M16 3l-2 18"/>',
  mail:'<rect x="3" y="5" width="18" height="14" rx="1"/><path d="m3 7 9 6 9-6"/>',
  ioc:'<path d="M4 4h16v16H4z"/><path d="M8 9h8M8 13h8M8 17h5"/>',
  case:'<path d="M3 7h18v13H3z"/><path d="M8 7V4h8v3"/>',
  gear:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1"/>',
  shield:'<path d="M12 2l8 3v6c0 5-3.5 9-8 11-4.5-2-8-6-8-11V5z"/>',
  alert:'<path d="M12 3 2 21h20z"/><path d="M12 10v5M12 18v.5"/>',
};
const icon = k => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${I[k]}</svg>`;

const MODS = {
  dominio: { t:'Domínio', ic:'globe', ph:'exemplo.com.br', ex:['example.com','gov.br'], d:'DNS, registro (RDAP), subdomínios por Certificate Transparency, certificado TLS, site e proteção de e-mail (SPF/DMARC).' },
  ip:      { t:'Endereço IP', ic:'ip', ph:'8.8.8.8', ex:['8.8.8.8','1.1.1.1'], d:'Dono da rede, país, DNS reverso e serviços expostos com vulnerabilidades conhecidas (Shodan InternetDB — consulta passiva).' },
  link:    { t:'Link suspeito', ic:'link', ph:'https://bit.ly/…', ex:['http://bit.ly/conta-pix-verificar'], d:'Segue os redirecionamentos sem abrir a página no seu navegador e procura sinais de phishing.' },
  arquivo: { t:'Arquivo', ic:'file', d:'Hashes, tipo real, metadados (autor, software, GPS) e indicadores dentro do arquivo. O arquivo não sai do computador; só o hash é consultado (se houver chave).' },
  hash:    { t:'Hash', ic:'hash', ph:'SHA-256, SHA-1 ou MD5', ex:['44d88612fea8a8f36de82e1278abb02f'], d:'Reputação de um arquivo pelo hash no VirusTotal e no MalwareBazaar.' },
  email:   { t:'E-mail suspeito', ic:'mail', d:'Cole os cabeçalhos completos do e-mail ("Mostrar original" no Gmail, "Ver código-fonte" no Outlook) para ver o caminho percorrido, SPF/DKIM/DMARC e sinais de golpe.' },
  iocs:    { t:'Extrair IOCs', ic:'ioc', d:'Cole qualquer texto (relatório, log, e-mail) para separar URLs, domínios, IPs, e-mails, hashes e CVEs — com versão "defanged" para compartilhar com segurança.' },
};
let page = 'dominio', last = {}, cases = [], cfg = {};

async function api(path, body) {
  const r = await fetch(BASE + 'api/' + path, body ? { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) } : undefined);
  const j = await r.json().catch(() => ({ erro: r.statusText }));
  if (!r.ok) throw new Error(j.erro || 'falha');
  return j;
}

function renderNav() {
  $('#nav').innerHTML = Object.entries(MODS).map(([id, m]) => `<button class="navi ${page===id?'on':''}" data-go="${id}">${icon(m.ic)}${m.t}</button>`).join('') +
    `<div class="navsep">INVESTIGAÇÃO</div>` +
    `<button class="navi ${page==='casos'?'on':''}" data-go="casos">${icon('case')}Casos</button>` +
    `<button class="navi ${page==='config'?'on':''}" data-go="config">${icon('gear')}Configurações</button>`;
}

function renderPage() {
  renderNav();
  if (page === 'casos') return renderCases();
  if (page === 'config') return renderConfig();
  const m = MODS[page];
  let input;
  if (page === 'email' || page === 'iocs') input = `<div style="margin-top:16px"><textarea id="q" placeholder="${page==='email'?'Received: from …\nFrom: …\nSubject: …':'Cole aqui o texto…'}"></textarea></div><div class="bar"><button class="btn pri" id="go">Analisar</button></div>`;
  else if (page === 'arquivo') input = `<label class="drop" id="drop"><input type="file" id="fileinp" hidden><div>${icon('file').replace('<svg','<svg style="width:34px;height:34px;color:var(--acc)"')}</div><b>Arraste um arquivo aqui</b> ou clique para escolher<div class="muted" style="font-size:12px">até 50 MB · fica no seu computador</div></label>`;
  else input = `<div class="search"><input id="q" placeholder="${esc(m.ph)}" autocomplete="off" spellcheck="false"><button class="btn pri" id="go">Investigar</button></div>
    <div class="ex">Exemplos: ${m.ex.map(e => `<a data-ex="${esc(e)}">${esc(e)}</a>`).join('')}</div>`;
  $('#main').innerHTML = `<h1>${m.t}</h1><p class="muted">${m.d}</p>${input}<div id="out"></div>` +
    `<div class="note">Use o Capix Faro só em alvos que você tem autorização para investigar ou em ameaças recebidas por você/sua organização. As consultas usam fontes públicas e passivas.</div>`;
  if (last[page]) showResult(page, last[page]);
  const q = $('#q'); if (q) { q.focus(); q.addEventListener('keydown', e => { if (e.key === 'Enter' && q.tagName === 'INPUT') investigate(); }); }
  const go = $('#go'); if (go) go.onclick = investigate;
  const fi = $('#fileinp'), dr = $('#drop');
  if (fi) {
    fi.onchange = () => fi.files[0] && sendFile(fi.files[0]);
    dr.addEventListener('dragover', e => { e.preventDefault(); dr.classList.add('over'); });
    dr.addEventListener('dragleave', () => dr.classList.remove('over'));
    dr.addEventListener('drop', e => { e.preventDefault(); dr.classList.remove('over'); e.dataTransfer.files[0] && sendFile(e.dataTransfer.files[0]); });
  }
}

const ENDPOINT = { dominio:'dominio', ip:'ip', link:'link', hash:'hash', email:'email', iocs:'iocs' };
async function investigate() {
  const q = $('#q').value.trim(); if (!q) return;
  const mod = page;
  $('#out').innerHTML = `<p class="muted" style="margin-top:18px"><span class="spin"></span>Investigando… isso pode levar alguns segundos.</p>`;
  try { last[mod] = { q, r: await api(ENDPOINT[mod], { q }) }; if (page === mod) showResult(mod, last[mod]); }
  catch (e) { $('#out').innerHTML = `<p class="err" style="margin-top:18px">${esc(e.message)}</p>`; }
}
async function sendFile(f) {
  if (f.size > 50 * 1024 * 1024) { $('#out').innerHTML = `<p class="err">Arquivo maior que 50 MB.</p>`; return; }
  $('#out').innerHTML = `<p class="muted" style="margin-top:18px"><span class="spin"></span>Analisando ${esc(f.name)}…</p>`;
  const buf = new Uint8Array(await f.arrayBuffer());
  let bin = ''; for (let i = 0; i < buf.length; i += 0x8000) bin += String.fromCharCode.apply(null, buf.subarray(i, i + 0x8000));
  try { last.arquivo = { q: f.name, r: await api('arquivo', { nome: f.name, dados: btoa(bin) }) }; showResult('arquivo', last.arquivo); }
  catch (e) { $('#out').innerHTML = `<p class="err">${esc(e.message)}</p>`; }
}

/* ---------- renderização dos resultados ---------- */
const sev = s => ({ alto:'bad', medio:'warn', baixo:'' })[s] ?? '';
const sevTxt = s => ({ alto:'Alto', medio:'Médio', baixo:'Baixo' })[s] || s;
const kv = rows => `<table class="kv">${rows.filter(r => r[1] !== undefined && r[1] !== '' && r[1] !== null).map(([k, v]) => `<tr><td>${k}</td><td>${v}</td></tr>`).join('')}</table>`;
const card = (ic, title, body) => `<div class="card"><h3>${icon(ic)}${title}</h3>${body}</div>`;
const errOr = (o, fn) => !o ? '<span class="muted">—</span>' : o._erro ? `<span class="muted">Não disponível (${esc(o._erro.slice(0, 90))})</span>` : fn(o);
const pills = (arr, cls = '') => (arr || []).map(x => `<span class="pill ${cls}">${esc(x)}</span>`).join('') || '<span class="muted">nenhum</span>';
function alertsBlock(a, risco) {
  if (!a) return '';
  const head = risco ? `<div class="risk ${risco.nivel}"><div class="num">${risco.pontos}</div><div><b>Risco ${sevTxt(risco.nivel).toLowerCase()}</b><div class="muted">pontuação de 0 a 100 com base nos sinais encontrados</div></div></div>` : '';
  return head + card('alert', `Sinais encontrados (${a.length})`, a.length ? a.map(([s, t]) => `<div class="alert"><span class="pill ${sev(s)}">${sevTxt(s)}</span><span>${esc(t)}</span></div>`).join('') : '<span class="pill ok">Nada suspeito encontrado</span>');
}
function repBlock(r) {
  if (!r) return '';
  if (r.obs) return kv([[esc(r.fonte), `<span class="muted">${esc(r.obs)}</span>`]]);
  if (r.malicioso !== undefined) return kv([[esc(r.fonte), `<span class="pill ${r.malicioso ? 'bad' : 'ok'}">${r.malicioso} maliciosos</span><span class="pill ${r.suspeito ? 'warn' : ''}">${r.suspeito} suspeitos</span><span class="pill">${r.inofensivo} inofensivos</span><span class="pill">${r.nao_detectado} sem detecção</span>`]]);
  return kv([[esc(r.fonte), esc(r.malware ? `${r.malware} · ${r.tipo || ''} · visto em ${r.visto_em || '?'}` : '')], ['Tags', pills(r.tags)]]);
}
function iocBlock(iocs, title = 'Indicadores (IOCs)') {
  const names = { url:'URLs', domain:'Domínios', ipv4:'IPs', email:'E-mails', sha256:'SHA-256', sha1:'SHA-1', md5:'MD5', cve:'CVEs' };
  const ks = Object.keys(iocs || {});
  return card('ioc', title, ks.length ? kv(ks.map(k => [names[k] || k, iocs[k].map(v => `<div class="mono">${esc(v)}</div>`).join('')])) : '<span class="muted">nenhum encontrado</span>');
}

const VIEW = {
  dominio: r => alertsBlock(r.alertas) + `<div class="grid2">` +
    card('globe', 'Registro', errOr(r.registro, g => kv([['Registrador', esc(g.registrar)], ['Criado em', esc(g.criado) + (g.idade_dias != null ? ` <span class="muted">(${Math.floor(g.idade_dias / 365)} anos)</span>` : '')], ['Expira em', esc(g.expira)], ['Atualizado', esc(g.atualizado)], ['Servidores DNS', pills(g.nameservers)], ['Status', pills(g.status)]]))) +
    card('ip', 'DNS', errOr(r.dns, d => kv(Object.entries(d).map(([k, v]) => [k, v.map(x => `<div class="mono">${esc(x)}</div>`).join('')])))) +
    card('shield', 'Certificado TLS', errOr(r.tls, t => t.valido === false ? `<span class="pill bad">Inválido</span> ${esc(t.erro)}` : kv([['Versão', esc(t.versao)], ['Emitido por', esc(t.emissor)], ['Para', esc(t.assunto)], ['Válido até', esc(t.ate) + ` <span class="pill ${t.dias_restantes < 15 ? 'warn' : 'ok'}">${t.dias_restantes} dias</span>`], ['Nomes', pills(t.sans.slice(0, 12))]]))) +
    card('link', 'Site', errOr(r.web, w => kv([['Título', esc(w.titulo)], ['Status', esc(w.status)], ['Servidor', esc(w.servidor)], ['Tecnologia', esc(w.tecnologia)], ['Destino final', `<span class="mono">${esc(w.final)}</span>`],
      ['Cabeçalhos', Object.entries(w.cabecalhos_seguranca || {}).map(([k, v]) => `<span class="pill ${v ? 'ok' : 'warn'}">${esc(k)}</span>`).join('')]]))) +
    card('mail', 'Proteção de e-mail', errOr(r.email, e => kv([['SPF', e.spf ? `<span class="mono">${esc(e.spf)}</span>` : '<span class="pill warn">ausente</span>'], ['DMARC', e.dmarc ? `<span class="mono">${esc(e.dmarc)}</span>` : '<span class="pill warn">ausente</span>']]))) +
    `</div>` + card('globe', `Subdomínios (Certificate Transparency)${Array.isArray(r.subdominios) ? ` — ${r.subdominios.length}` : ''}`, errOr(r.subdominios, s => s.length ? `<div class="list">${s.map(x => `<div>${esc(x)}</div>`).join('')}</div>` : '<span class="muted">nenhum</span>')),
  ip: r => alertsBlock(r.alertas) + `<div class="grid2">` +
    card('ip', 'Rede', errOr(r.rede, n => kv([['Organização', esc(n.organizacao)], ['Nome da rede', esc(n.nome)], ['Faixa', `<span class="mono">${esc(n.faixa)}</span>`], ['País', esc(n.pais)], ['Tipo', esc(n.tipo)], ['DNS reverso', `<span class="mono">${esc(r.dns_reverso) || '—'}</span>`]]))) +
    card('shield', 'Exposição na internet', kv([['Portas abertas', pills((r.exposicao.portas || []).map(String))], ['Vulnerabilidades', pills(r.exposicao.vulns, 'bad')], ['Tags', pills(r.exposicao.tags)], ['Nomes', pills(r.exposicao.hostnames)], ['Software (CPE)', pills(r.exposicao.cpes)]]) + (r.exposicao.obs ? `<p class="muted">${esc(r.exposicao.obs)}</p>` : '')) +
    `</div>` + card('alert', 'Reputação', repBlock(r.reputacao)),
  link: r => alertsBlock(r.alertas, r.risco) +
    card('link', 'Caminho do link', errOr(r.web, w => `<div class="chain">${(w.cadeia || []).map((c, i) => `<div><span class="st">${c.status}</span><span class="mono">${i ? '↳ ' : ''}${esc(c.url)}</span></div>`).join('')}</div>` +
      kv([['Título da página', esc(w.titulo)], ['Servidor', esc(w.servidor)], ['Tecnologia', esc(w.tecnologia)], ['Pede senha', w.formularios_senha ? '<span class="pill warn">sim</span>' : 'não']]))) +
    (r.registro ? card('globe', 'Domínio de destino', errOr(r.registro, g => kv([['Registrador', esc(g.registrar)], ['Criado em', esc(g.criado) + (g.idade_dias != null ? ` <span class="pill ${g.idade_dias < 60 ? 'bad' : ''}">${g.idade_dias} dias</span>` : '')]]))) : '') +
    card('alert', 'Reputação', repBlock(r.reputacao)),
  hash: r => alertsBlock(r.alertas) + card('hash', `Hash ${esc(r.tipo)}`, `<span class="mono">${esc(r.alvo)}</span>`) + `<div class="grid2">` + card('alert', 'VirusTotal', repBlock(r.reputacao)) + card('alert', 'MalwareBazaar', repBlock(r.malwarebazaar)) + `</div>`,
  arquivo: r => alertsBlock(r.alertas) + `<div class="grid2">` +
    card('file', esc(r.alvo), kv([['Tamanho', (r.tamanho / 1024).toFixed(1) + ' KB'], ['Tipo real', esc(r.tipo)], ['MD5', `<span class="mono">${r.hashes.md5}</span>`], ['SHA-1', `<span class="mono">${r.hashes.sha1}</span>`], ['SHA-256', `<span class="mono">${r.hashes.sha256}</span>`]]) +
      `<div class="bar"><button class="btn sm" data-hash="${r.hashes.sha256}">Consultar reputação do hash</button></div>`) +
    card('ioc', 'Metadados', Object.keys(r.metadados || {}).length ? kv(Object.entries(r.metadados).slice(0, 60).map(([k, v]) => [esc(k), `<span class="mono">${esc(typeof v === 'object' ? JSON.stringify(v) : v)}</span>`])) : '<span class="muted">nenhum metadado encontrado (ou exiftool ausente)</span>') +
    `</div>` + iocBlock(r.iocs, 'Indicadores encontrados dentro do arquivo'),
  email: r => alertsBlock(r.alertas, r.risco) + `<div class="grid2">` +
    card('mail', 'Mensagem', kv([['Assunto', esc(r.assunto)], ['De', esc(r.de)], ['Para', esc(r.para)], ['Data', esc(r.data)], ['Return-Path', esc(r.return_path)], ['Responder para', esc(r.reply_to)], ['Programa de envio', esc(r.mailer)], ['Message-ID', `<span class="mono">${esc(r.message_id)}</span>`]])) +
    card('shield', 'Autenticação', kv(Object.entries(r.autenticacao).map(([k, v]) => [k.toUpperCase(), `<span class="pill ${v === 'pass' ? 'ok' : v ? 'bad' : 'warn'}">${esc(v || 'sem resultado')}</span>`])) +
      kv([['IP de origem', r.ip_origem ? `<span class="mono">${esc(r.ip_origem)}</span> <button class="btn sm" data-ipq="${esc(r.ip_origem)}">Investigar IP</button>` : '—']])) +
    `</div>` + card('ip', `Caminho do e-mail (${r.saltos.length} servidores)`, `<div class="hops">${r.saltos.map(h => `<div class="hop"><b class="mono">${esc(h.de || '?')}</b> → <span class="mono">${esc(h.por || '?')}</span><div class="muted" style="font-size:12px">${esc(h.data)}${h.atraso_s ? ` · +${h.atraso_s}s` : ''}${h.ips.length ? ' · IPs: ' + h.ips.map(esc).join(', ') : ''}</div></div>`).join('')}</div>`) +
    iocBlock(r.iocs, 'Indicadores no corpo do e-mail'),
  iocs: r => iocBlock(r.iocs, 'IOCs encontrados') + card('shield', 'Versão "defanged" (segura para colar em chats e relatórios)', Object.keys(r.defang || {}).length ? `<textarea readonly style="height:140px">${esc(Object.values(r.defang).flat().join('\n'))}</textarea>` : '<span class="muted">—</span>'),
};

function showResult(mod, { q, r }) {
  $('#out').innerHTML = `<div class="bar"><span class="muted">Resultado para <b style="color:var(--txt)">${esc(r.alvo || q).slice(0, 120)}</b> · ${esc(r.quando || '')}</span><span style="flex:1"></span>
    <select id="caseSel"><option value="">Adicionar ao caso…</option>${cases.map(c => `<option value="${c.id}">${esc(c.nome)}</option>`).join('')}<option value="__novo">+ Novo caso</option></select>
    <button class="btn sm" id="copyJson">Copiar JSON</button></div>` + VIEW[mod](r);
  $('#caseSel').onchange = async e => {
    let id = e.target.value; if (!id) return;
    if (id === '__novo') { const nome = prompt('Nome do novo caso:'); if (!nome) { e.target.value = ''; return; } id = (await api('casos', { acao:'criar', nome })).id; await loadCases(); }
    await api('casos', { acao:'adicionar', id, item: { modulo: mod, alvo: r.alvo || q.slice(0, 200), resultado: r } });
    e.target.outerHTML = `<span class="pill ok">Adicionado ao caso</span>`;
  };
  $('#copyJson').onclick = () => { navigator.clipboard?.writeText(JSON.stringify(r, null, 2)); $('#copyJson').textContent = 'Copiado!'; };
}

/* ---------- casos ---------- */
async function loadCases() { try { cases = await api('casos'); } catch { cases = []; } }
async function renderCases(openId) {
  await loadCases();
  if (openId) return renderCase(await api('casos', { acao:'ver', id: openId }));
  $('#main').innerHTML = `<h1>Casos</h1><p class="muted">Junte os achados de uma investigação, anote e exporte um relatório.</p>
    <div class="search"><input id="cname" placeholder="Nome do novo caso (ex.: Phishing Banco — nov/2026)"><button class="btn pri" id="cnew">Criar caso</button></div>
    <div style="margin-top:14px">${cases.length ? cases.map(c => `<div class="case" data-case="${c.id}">${icon('case').replace('<svg','<svg style="width:18px;color:var(--acc)"')}<b>${esc(c.nome)}</b><span class="muted">${c.itens} itens · ${esc(c.criado)}</span></div>`).join('') : '<p class="muted">Nenhum caso ainda.</p>'}</div>`;
  $('#cnew').onclick = async () => { const nome = $('#cname').value.trim(); if (!nome) return; const c = await api('casos', { acao:'criar', nome }); renderCase(c); };
}
function caseSummary(it) {
  const r = it.resultado || {}, a = r.alertas || [];
  const top = a.filter(x => x[0] === 'alto').length, mid = a.filter(x => x[0] === 'medio').length;
  return `${top ? `<span class="pill bad">${top} alto</span>` : ''}${mid ? `<span class="pill warn">${mid} médio</span>` : ''}${!top && !mid ? '<span class="pill ok">sem sinais graves</span>' : ''}`;
}
function renderCase(c) {
  $('#main').innerHTML = `<p><a class="muted" style="cursor:pointer" id="back">← Casos</a></p><h1>${esc(c.nome)}</h1><p class="muted">Criado em ${esc(c.criado)} · ${c.itens.length} itens</p>
    <div class="bar"><button class="btn sm pri" id="expMd">Exportar relatório (.md)</button><button class="btn sm" id="expJson">Exportar dados (.json)</button><span style="flex:1"></span><button class="btn sm" id="del" style="background:#5a2a26">Apagar caso</button></div>
    ${c.itens.map((it, i) => `<div class="card"><h3>${icon(MODS[it.modulo]?.ic || 'ioc')}${esc(MODS[it.modulo]?.t || it.modulo)} · <span class="mono">${esc(it.alvo)}</span><span style="flex:1"></span><span class="muted" style="font-weight:400">${esc(it.quando)}</span></h3>${caseSummary(it)}
      <ul style="margin:8px 0 0 18px;font-size:13px">${(it.resultado?.alertas || []).map(a => `<li>${esc(a[1])}</li>`).join('')}</ul><div class="bar"><button class="btn sm" data-rm="${i}">Remover</button></div></div>`).join('') || '<p class="muted">Nenhum item. Investigue algo e use "Adicionar ao caso".</p>'}
    <h2>Anotações</h2><textarea id="notes" placeholder="Hipóteses, próximos passos, contatos do incidente…">${esc(c.notas)}</textarea>
    <div class="bar"><button class="btn sm" id="saveNotes">Salvar anotações</button></div>`;
  $('#back').onclick = () => renderCases();
  $('#saveNotes').onclick = async () => { await api('casos', { acao:'notas', id:c.id, notas: $('#notes').value }); $('#saveNotes').textContent = 'Salvo ✓'; };
  $('#del').onclick = async () => { if (confirm('Apagar este caso?')) { await api('casos', { acao:'apagar', id:c.id }); renderCases(); } };
  document.querySelectorAll('[data-rm]').forEach(b => b.onclick = async () => renderCase(await api('casos', { acao:'remover-item', id:c.id, indice:+b.dataset.rm })));
  const dl = (name, text, type) => { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type })); a.download = name; a.click(); };
  const slug = c.nome.toLowerCase().normalize('NFD').replace(/[^\w]+/g, '-').replace(/^-|-$/g, '');
  $('#expJson').onclick = () => dl(`faro-${slug}.json`, JSON.stringify(c, null, 2), 'application/json');
  $('#expMd').onclick = () => dl(`faro-${slug}.md`, report(c), 'text/markdown');
}
function report(c) {
  let md = `# Relatório de investigação — ${c.nome}\n\n*Gerado pelo Capix Faro (Capix Linux OS · by UnbugSTI) em ${new Date().toLocaleString('pt-BR')}*\n\n`;
  md += `## Resumo\n\n| Tipo | Alvo | Sinais altos | Sinais médios |\n|---|---|---|---|\n`;
  c.itens.forEach(it => { const a = it.resultado?.alertas || []; md += `| ${MODS[it.modulo]?.t || it.modulo} | \`${it.alvo.replace(/\./g, '[.]')}\` | ${a.filter(x => x[0] === 'alto').length} | ${a.filter(x => x[0] === 'medio').length} |\n`; });
  c.itens.forEach(it => {
    md += `\n## ${MODS[it.modulo]?.t || it.modulo}: \`${it.alvo.replace(/\./g, '[.]')}\`\n\n_${it.quando}_\n\n`;
    (it.resultado?.alertas || []).forEach(a => md += `- **${sevTxt(a[0])}:** ${a[1]}\n`);
    const io = it.resultado?.iocs; if (io && Object.keys(io).length) { md += `\nIndicadores:\n\n`; Object.entries(io).forEach(([k, v]) => v.forEach(x => md += `- ${k}: \`${x.replace(/\./g, '[.]').replace(/^http/, 'hxxp')}\`\n`)); }
  });
  if (c.notas) md += `\n## Anotações\n\n${c.notas}\n`;
  return md;
}

/* ---------- configurações ---------- */
async function renderConfig() {
  try { cfg = await api('config'); } catch { cfg = {}; }
  const row = (k, nome, url, desc) => `<div class="card"><h3>${icon('gear')}${nome} ${cfg[k] ? '<span class="pill ok">configurada</span>' : '<span class="pill">não configurada</span>'}</h3><p class="muted" style="font-size:13px;margin-bottom:8px">${desc} Crie a chave gratuita em <span class="mono">${url}</span>.</p>
    <div class="search" style="margin:0"><input type="password" id="k-${k}" placeholder="${cfg[k] ? '•••••••• (deixe vazio e salve para remover)' : 'Cole a chave da API'}"><button class="btn sm pri" data-key="${k}">Salvar</button></div></div>`;
  $('#main').innerHTML = `<h1>Configurações</h1><p class="muted">Chaves opcionais para consultar reputação. Ficam só no seu computador (<span class="mono">~/.config/capix/faro.json</span>, acesso restrito ao seu usuário).</p><h2>Fontes de reputação</h2>` +
    row('virustotal', 'VirusTotal', 'virustotal.com', 'Reputação de arquivos, links e IPs em ~70 antivírus.') +
    row('abusech', 'abuse.ch (MalwareBazaar)', 'auth.abuse.ch', 'Base de amostras de malware.') +
    `<h2>Fontes sem chave</h2><div class="card">${kv([['DNS', 'servidores do sistema'], ['RDAP', 'rdap.org (registro de domínios e redes)'], ['Certificate Transparency', 'crt.sh'], ['Exposição de IPs', 'Shodan InternetDB (dados passivos)']])}</div>
     <div class="note">O Capix Faro não faz varredura ativa de portas nem busca de pessoas. Respeite a LGPD e os termos de uso de cada fonte.</div>`;
  document.querySelectorAll('[data-key]').forEach(b => b.onclick = async () => { const k = b.dataset.key; cfg = await api('config', { [k]: $('#k-' + k).value }); renderConfig(); });
}

document.addEventListener('click', e => {
  const g = e.target.closest('[data-go]'); if (g) { page = g.dataset.go; renderPage(); return; }
  const ex = e.target.closest('[data-ex]'); if (ex) { $('#q').value = ex.dataset.ex; investigate(); return; }
  const c = e.target.closest('[data-case]'); if (c) { renderCases(c.dataset.case); return; }
  const h = e.target.closest('[data-hash]'); if (h) { page = 'hash'; renderPage(); $('#q').value = h.dataset.hash; investigate(); return; }
  const ipq = e.target.closest('[data-ipq]'); if (ipq) { page = 'ip'; renderPage(); $('#q').value = ipq.dataset.ipq; investigate(); }
});

(async () => {
  if (DRY) $('#demo').classList.remove('hidden');
  document.querySelectorAll('.logo-img').forEach(i => i.src = asset('logo.png'));
  await loadCases();
  renderPage();
})();
</script>
</body>
</html>
